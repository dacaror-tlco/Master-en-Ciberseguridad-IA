services:
  scam-shield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: scam-shield
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - /mnt/hdd/scam-shield/data:/data
    environment:
      - DATABASE_URL=sqlite:////data/scamshield.db
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TRON_API_KEY=${TRON_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENSPAM_API_KEY=${OPENSPAM_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - PIMEYES_API_KEY=${PIMEYES_API_KEY}
      - IPQUALITYSCORE_API_KEY=${IPQUALITYSCORE_API_KEY}
      - FCA_API_EMAIL=${FCA_API_EMAIL}
      - FCA_API_KEY=${FCA_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
