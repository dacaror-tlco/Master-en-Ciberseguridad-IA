# Punto de entrada único del stack de Nexus: sirve el frontend ya
# compilado y hace de reverse proxy hacia los cinco backends por su
# nombre de servicio en la red de Docker (ver ../docker-compose.yml).
#
# El asistente conversacional no es un sexto backend: lo sirve Informes, así
# que vive bajo /api/reports (/api/reports/chat y /api/reports/chat/stream).
#
# Los cinco backends registran sus rutas SIN prefijo de módulo (Casos usa
# /cases, Timeline usa /timeline, etc. — ver docs/CONTRATOS.md) así que
# aquí quitamos el prefijo /api/<módulo> antes de reenviar la petición.
# Esto es también lo que hace innecesario tocar CORS en ningún backend:
# el navegador solo habla con este origen (nexus.gondorhub.com), nunca
# directamente con un backend — mismo origen, sin preflight de por medio.
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/cases/ {
        rewrite ^/api/cases(/.*)$ $1 break;
        proxy_pass http://casos:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/osint/ {
        rewrite ^/api/osint(/.*)$ $1 break;
        proxy_pass http://osint:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/tracking/ {
        rewrite ^/api/tracking(/.*)$ $1 break;
        proxy_pass http://tracking:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/timeline/ {
        rewrite ^/api/timeline(/.*)$ $1 break;
        proxy_pass http://timeline:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Más específica que /api/reports/ de abajo, así que nginx la elige
    # primero: es el flujo SSE del asistente conversacional
    # (POST /chat/stream, ver sharingan/app/modules/chat/routes.py).
    #
    # `proxy_buffering off` es redundante con la cabecera X-Accel-Buffering
    # que ya manda el backend, y se pone igual: si alguien quita la cabecera
    # creyendo que no hace nada, el streaming seguiría funcionando en vez de
    # convertirse en «una sola respuesta al final» sin que nada falle de
    # forma visible. Los timeouts largos son lo que de verdad hace falta
    # aquí: el hueco entre el primer byte y el siguiente trozo puede pasar
    # del minuto por defecto de nginx, y un 504 a mitad de emisión llega al
    # navegador como un flujo cortado sin explicación.
    location /api/reports/chat/stream {
        rewrite ^/api/reports(/.*)$ $1 break;
        proxy_pass http://informes:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Informes: generar un informe y responder en el chat sin streaming son
    # una única petición que espera a que la IA termine de redactar, y eso
    # pasa de los 60 s por defecto de nginx con facilidad. Sin esto, el
    # navegador recibe un 504 mientras el backend sigue trabajando y acaba
    # guardando un informe que el usuario cree que falló.
    location /api/reports/ {
        rewrite ^/api/reports(/.*)$ $1 break;
        proxy_pass http://informes:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend estático (React, ya compilado en la etapa de build de este
    # mismo Dockerfile) — cualquier ruta que no matchee /api/* cae aquí,
    # con fallback a index.html para que el router del lado del cliente
    # (react-router) resuelva rutas como /osint/domain sin recargar.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
