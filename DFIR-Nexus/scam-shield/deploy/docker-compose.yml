services:
  mysql:
    image: mysql:8.4
    container_name: scam-shield-mysql
    restart: unless-stopped
    volumes:
      - /mnt/hdd/scam-shield/mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  scam-shield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: scam-shield
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8088:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DB=${MYSQL_DB}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - TRON_API_KEY=${TRON_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENSPAM_API_KEY=${OPENSPAM_API_KEY}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - PIMEYES_API_KEY=${PIMEYES_API_KEY}
      - IPQUALITYSCORE_API_KEY=${IPQUALITYSCORE_API_KEY}
      - FCA_API_EMAIL=${FCA_API_EMAIL}
      - FCA_API_KEY=${FCA_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
