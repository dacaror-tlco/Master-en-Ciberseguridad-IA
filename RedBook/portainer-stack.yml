# RedBook — stack para Portainer (puerto 8093)
#
# La web se COMPILA en el PC (mkdocs build, dentro de subir-pi.bat) y aquí
# solo se SIRVE con nginx. Un único contenedor, sin build en la Pi.
#
# Requisitos (una sola vez): que exista la carpeta /mnt/hdd/webs/RedBook/site
# (subir-pi.bat la crea al primer envío).
#
# Flujo al cambiar apuntes:
#   - Ejecuta subir-pi.bat en el PC. Compila site/ y lo sincroniza aquí.
#   - No hay que recrear el stack ni reiniciar nada: nginx sirve el site/ nuevo
#     en la siguiente petición.
# Queda en http://<ip-pi>:8093

services:
  web-redbook:
    image: nginx:alpine
    container_name: web-redbook
    restart: unless-stopped
    ports:
      - "8093:80"
    volumes:
      - /mnt/hdd/webs/RedBook/site:/usr/share/nginx/html:ro
